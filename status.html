<style>
:root {
  --bg:#0a0a0f; --bg-2:#15131c; --bg-3:#1c1926;
  --ink:#f7f4ff; --ink-2:#b3aec7; --ink-3:#7a7591;
  --pink: oklch(72% 0.24 350); --green: oklch(76% 0.21 150);
  --blue: oklch(72% 0.19 255); --yellow: oklch(88% 0.17 95);
  --red: oklch(62% 0.22 25);
  --font-display: 'Anton', sans-serif;
  --font-sans: 'Space Grotesk', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}
html[data-theme="light"] {
  --bg:#f5efe1; --bg-2:#ece2c8; --bg-3:#e1d4ac;
  --ink:#0a0a0f; --ink-2:#4a4658; --ink-3:#726d85;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); background: var(--bg); color: var(--ink); overflow-x: hidden; transition: background-color .2s ease, color .2s ease; }
a { text-decoration: none; color: inherit; }
::selection { background: var(--pink); color: #0a0a0f; }
.container { max-width: 860px; margin: 0 auto; padding: 0 24px; }
@media (max-width: 640px) { .container { padding: 0 18px; } }

nav { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 24px; background: var(--bg); border-bottom: 4px solid var(--ink); }
nav .plate { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
nav .plate .dz { width: 42px; height: 42px; background: var(--pink); border: 3px solid var(--ink); display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 20px; color: #0a0a0f; transform: rotate(-6deg); box-shadow: 4px 4px 0 var(--ink); flex-shrink: 0; }
nav .plate .label { font-family: var(--font-mono); font-weight: 700; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
nav .links { display: flex; gap: 26px; align-items: center; }
nav .links a { font-family: var(--font-mono); font-weight: 600; font-size: 12.5px; text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }
nav .links a:hover { color: var(--pink); }
nav .links a.active { color: var(--pink); }
.theme-btn { width: 96px; height: 38px; flex-shrink: 0; border: 3px solid var(--ink); background: var(--yellow); font-family: var(--font-mono); font-weight: 700; font-size: 10.5px; color: #0a0a0f; box-shadow: 4px 4px 0 var(--ink); cursor: pointer; }
@media (max-width: 640px) { nav .links { gap: 14px; } nav .links a { font-size: 11px; } .theme-btn { width: 44px; font-size: 15px; } }

.kicker { display: inline-flex; background: var(--yellow); border: 3px solid var(--ink); padding: 6px 16px; box-shadow: 4px 4px 0 var(--ink); font-family: var(--font-mono); font-weight: 700; font-size: 12px; text-transform: uppercase; color: #0a0a0f; transform: rotate(-2deg); margin: 40px 0 26px; }

/* ---- ring: stats flanking the avatar ---- */
.char-ring { display: grid; grid-template-columns: 1fr auto 1fr; gap: 18px; align-items: center; }
.ring-side { display: flex; flex-direction: column; gap: 14px; }
@media (max-width: 820px) {
  .char-ring { grid-template-columns: 1fr; }
  .char-ring .char-card { order: -1; }
  .ring-side { display: grid; grid-template-columns: 1fr 1fr; }
}

/* ---- character card ---- */
.char-card { display: flex; flex-direction: column; align-items: center; gap: 14px; background: var(--bg-2); border: 3px solid var(--ink); box-shadow: 8px 8px 0 var(--pink); padding: 24px; text-align: center; }
.char-card .name { font-family: var(--font-display); font-size: clamp(22px, 3.4vw, 30px); line-height: 1; }
.char-card .cls { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em; margin-top: 4px; }
.char-card .lvl-block { width: 100%; }
.lvl-row { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; text-transform: uppercase; margin-bottom: 6px; }
.xp-track { height: 14px; border: 2.5px solid var(--ink); background: var(--bg-3); }
.xp-fill { height: 100%; background: var(--yellow); }

/* ---- pixel avatar ---- */
.portrait-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.portrait-frame { position: relative; background: #0a0a0f; border: 4px solid var(--ink); box-shadow: 6px 6px 0 var(--blue); padding: 12px; line-height: 0; }
.portrait-grid { display: grid; grid-template-columns: repeat(12, 1fr); grid-template-rows: repeat(14, 1fr); width: clamp(120px, 16vw, 168px); aspect-ratio: 12 / 14; animation: portrait-bob 2.6s ease-in-out infinite; }
.portrait-px { width: 100%; height: 100%; }
@keyframes portrait-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
body[data-state="active"] .portrait-grid { animation-duration: 1s; }
body[data-state="rest"] .portrait-grid { animation-duration: 4.2s; }
.state-badge { position: absolute; top: -12px; right: -12px; font-size: 22px; display: none; }
.state-badge.show { display: block; animation: badge-pulse 1.1s ease-in-out infinite; }
@keyframes badge-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.18); } }
.portrait-caption { font-family: var(--font-mono); font-size: 11px; color: #7cffb2; letter-spacing: .04em; }
.portrait-caption .blink { animation: blink-caret .9s steps(1) infinite; }
@keyframes blink-caret { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .portrait-grid { animation: none !important; } .portrait-caption .blink, .state-badge.show { animation: none; } }

/* ---- current state pill ---- */
.state-row { display: flex; justify-content: center; margin-top: 20px; }
.state-pill { display: inline-flex; align-items: center; gap: 9px; background: var(--bg-2); border: 3px solid var(--ink); padding: 8px 18px; font-family: var(--font-mono); font-weight: 700; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; }
.state-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

/* ---- vitals ---- */
.vital-card { background: var(--bg-2); border: 3px solid var(--ink); padding: 14px 16px 16px; }
.vital-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; gap: 8px; }
.vital-name { font-family: var(--font-mono); font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
.vital-val { font-family: var(--font-mono); font-weight: 700; font-size: 15px; white-space: nowrap; }
.bar-track { height: 14px; border: 2px solid var(--ink); background: var(--bg-3); overflow: hidden; }
.bar-fill { height: 100%; transition: width .4s ease; }
.vital-note { font-family: var(--font-mono); font-size: 10px; color: var(--ink-3); margin-top: 6px; }

.vitals-extra { display: flex; flex-direction: column; gap: 6px; margin-top: 24px; }
.vitals-extra .row { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-2); }
.vitals-extra .row b { color: var(--ink); }

/* ---- now playing (Spotify) ---- */
.now-playing { margin-top: 20px; }
.np-card { display: flex; align-items: center; gap: 14px; background: var(--bg-2); border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--green); padding: 12px 16px; transition: transform .12s ease, box-shadow .12s ease; }
.np-card:hover { transform: translate(3px,3px); box-shadow: 3px 3px 0 var(--green); }
.np-cover { width: 50px; height: 50px; border: 2px solid var(--ink); flex-shrink: 0; object-fit: cover; }
.np-info { flex: 1; min-width: 0; }
.np-track { font-weight: 700; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np-artist { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.np-eq { display: flex; align-items: flex-end; gap: 3px; height: 18px; flex-shrink: 0; }
.np-eq span { width: 4px; background: var(--green); border-radius: 1px; animation: eq-bounce .9s ease-in-out infinite; }
.np-eq span:nth-child(1) { animation-delay: 0s; }
.np-eq span:nth-child(2) { animation-delay: .2s; }
.np-eq span:nth-child(3) { animation-delay: .4s; }
@keyframes eq-bounce { 0%, 100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
.np-empty { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-3); }
@media (prefers-reduced-motion: reduce) { .np-eq span { animation: none; transform: scaleY(.8); } }

/* ---- mini inventory ---- */
.inventory { margin-top: 26px; }
.inv-title { font-family: var(--font-mono); font-weight: 700; font-size: 11px; letter-spacing: .08em; color: var(--ink-3); margin-bottom: 10px; }
.inv-row { display: flex; gap: 10px; flex-wrap: wrap; }
.inv-item { display: flex; align-items: center; gap: 8px; background: var(--bg-2); border: 2.5px solid var(--ink); padding: 8px 14px; font-family: var(--font-mono); font-size: 11.5px; font-weight: 700; }
.inv-item .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

.vitals-src { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-3); margin-top: 20px; }

footer { margin-top: 44px; padding: 22px 0 34px; border-top: 4px solid var(--ink); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); }
</style>

<script>
const toggle = document.getElementById('theme-toggle');
function syncToggleLabel() {
  toggle.textContent = document.documentElement.getAttribute('data-theme') === 'light' ? '◑ DARK' : '◐ LIGHT';
}
toggle.addEventListener('click', () => {
  const isLight = document.documentElement.getAttribute('data-theme') === 'light';
  if (isLight) {
    document.documentElement.removeAttribute('data-theme');
    localStorage.setItem('theme', 'dark');
  } else {
    document.documentElement.setAttribute('data-theme', 'light');
    localStorage.setItem('theme', 'light');
  }
  syncToggleLabel();
});
syncToggleLabel();

/* ============================================================
   PIXEL AVATAR — sprite 12x14 renderizado como grid de divs.
   ============================================================ */
const PORTRAIT_PALETTE = { '.': 'transparent', H: '#241b2e', S: '#e8b48c', K: '#120d16', P: '#ff2d78', Z: '#f7f4ff' };
const PORTRAIT_OPEN = [
  '..HHHHHHHH..',
  '.HHHHHHHHHH.',
  'HHHHHHHHHHHH',
  'HHSSSSSSSSHH',
  'HSSSSSSSSSSH',
  'SSSKSSSSKSSS',
  'SSSSSSSSSSSS',
  'SSSSSSSSSSSS',
  '..SSSSSSSS..',
  '.PPPPPPPPPP.',
  'PPPPPZZPPPPP',
  'PPPPPZZPPPPP',
  'PPPPPZZPPPPP',
  '.PPPPPPPPPP.',
];
const PORTRAIT_BLINK = PORTRAIT_OPEN.map((row, i) => (i === 5 ? 'SSSSSSSSSSSS' : row));

function renderPortrait(rows) {
  const grid = document.getElementById('portrait-grid');
  let html = '';
  rows.forEach(row => {
    for (const ch of row) html += `<div class="portrait-px" style="background:${PORTRAIT_PALETTE[ch]};"></div>`;
  });
  grid.innerHTML = html;
}
renderPortrait(PORTRAIT_OPEN);
if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
  setInterval(() => {
    renderPortrait(PORTRAIT_BLINK);
    setTimeout(() => renderPortrait(PORTRAIT_OPEN), 140);
  }, 3600);
}

/* ============================================================
   VITALS + NOW PLAYING — todo sale de vitals.json en la rama
   `data` del repo (fetch cross-origin a raw.githubusercontent, no
   desde main: así no le mete ruido al historial del sitio).
   - heart rate / spo2 / steps / sleep / ejercicio los escribe
     galaxy-vitals-bridge (Health Connect, en el celular) o
     scripts/sync_vitals.py (BLE directo).
   - now_playing lo actualiza un cron aparte que pega a la API de
     Spotify y escribe al mismo archivo.
   El "estado" (activo/tranquilo/reposo) es una inferencia simple
   desde el heart rate, no un dato explícito — no hay timestamp de
   "cuándo empezó/terminó" el último ejercicio como para saber con
   certeza si está en curso ahora mismo.
   ============================================================ */
const VITALS_URL = 'https://raw.githubusercontent.com/danielzunigazb/portfolio/data/vitals.json';
const VITAL_DEFS = [
  { key: 'heart_rate_bpm',        label: 'HEART RATE', unit: ' bpm', max: 180,    side: 'left',  zone: v => (v < 50 || v > 110 ? 'warn' : 'ok') },
  { key: 'oxygen_saturation_pct', label: 'SPO2',        unit: '%',    max: 100,    side: 'left',  zone: v => (v < 90 ? 'warn' : v < 95 ? 'mid' : 'ok') },
  { key: 'steps_today',           label: 'STEPS',       unit: '',     max: 10000,  side: 'right', zone: v => (v < 3000 ? 'warn' : v < 7000 ? 'mid' : 'ok') },
  { key: 'sleep_score',           label: 'SLEEP SCORE', unit: '',     max: 100,    side: 'right', zone: v => (v < 50 ? 'warn' : v < 75 ? 'mid' : 'ok') },
];
const ZONE_COLOR = { ok: 'var(--green)', mid: 'var(--yellow)', warn: 'var(--red)' };
const FRESH_WINDOW_MS = 6 * 3600 * 1000;
const NP_FRESH_WINDOW_MS = 10 * 60 * 1000;

function timeAgo(iso) {
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 60) return 'hace segundos';
  if (diff < 3600) return `hace ${Math.floor(diff / 60)} min`;
  if (diff < 86400) return `hace ${Math.floor(diff / 3600)} h`;
  return `hace ${Math.floor(diff / 86400)} d`;
}

function formatMinutes(min) {
  return `${Math.floor(min / 60)}h ${min % 60}m`;
}

function vitalCard(def, data, fresh) {
  const val = fresh ? data[def.key] : null;
  const pct = val == null ? 0 : Math.min(100, (val / def.max) * 100);
  const color = val == null ? 'var(--ink-3)' : ZONE_COLOR[def.zone(val)];
  return `
    <div class="vital-card">
      <div class="vital-top"><span class="vital-name">${def.label}</span><span class="vital-val">${val == null ? '—' : val + def.unit}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color};"></div></div>
      <div class="vital-note">${fresh ? 'actualizado ' + timeAgo(data.updated_at) : 'esperando sync'}</div>
    </div>`;
}

function renderExtra(data, fresh) {
  const el = document.getElementById('vitals-extra');
  if (!fresh) { el.innerHTML = ''; return; }
  const rows = [];
  if (data.sleep_duration_minutes != null) rows.push(`🛌 Sueño: <b>${formatMinutes(data.sleep_duration_minutes)}</b>`);
  if (data.floors_climbed_today != null) rows.push(`🪜 Pisos hoy: <b>${data.floors_climbed_today}</b>`);
  if (data.last_exercise) {
    const ex = data.last_exercise;
    rows.push(`🏃 Último ejercicio: <b>${ex.type}</b> · ${ex.duration_minutes} min · ${ex.calories} kcal · ${ex.mean_heart_rate_bpm} bpm prom`);
  }
  el.innerHTML = rows.map(r => `<div class="row">${r}</div>`).join('');
}

function deriveState(data, fresh) {
  const hr = fresh ? data.heart_rate_bpm : null;
  if (hr == null) return { key: 'unknown', label: 'SIN SEÑAL', icon: '❔', dot: 'var(--ink-3)', badge: null };
  if (hr > 110) return { key: 'active', label: 'ACTIVO', icon: '🔥', dot: 'var(--red)', badge: '🔥' };
  if (hr < 55) return { key: 'rest', label: 'REPOSO', icon: '😴', dot: 'var(--blue)', badge: '💤' };
  return { key: 'normal', label: 'TRANQUILO', icon: '🙂', dot: 'var(--green)', badge: null };
}

function renderState(data, fresh) {
  const state = deriveState(data, fresh);
  document.body.dataset.state = state.key;
  document.getElementById('state-row').innerHTML =
    `<div class="state-pill"><span class="state-dot" style="background:${state.dot};"></span>${state.icon} ${state.label}</div>`;
  const badgeEl = document.getElementById('state-badge');
  if (state.badge) { badgeEl.textContent = state.badge; badgeEl.classList.add('show'); }
  else { badgeEl.classList.remove('show'); }
  return state;
}

function renderNowPlaying(np) {
  const el = document.getElementById('now-playing');
  const fresh = !!(np && np.updated_at && (Date.now() - new Date(np.updated_at).getTime()) < NP_FRESH_WINDOW_MS);
  if (!fresh || !np.is_playing) {
    el.innerHTML = `<div class="np-empty">🎧 nada sonando ahora</div>`;
    return fresh;
  }
  el.innerHTML = `
    <a class="np-card" href="${np.url}" target="_blank">
      <img class="np-cover" src="${np.cover_url}" alt="">
      <div class="np-info">
        <div class="np-track">${np.track}</div>
        <div class="np-artist">${np.artists}</div>
      </div>
      <div class="np-eq"><span></span><span></span><span></span></div>
    </a>`;
  return fresh;
}

function renderInventory(healthFresh, npFresh) {
  const dot = (on) => `background:${on ? 'var(--green)' : 'var(--ink-3)'};`;
  document.getElementById('inventory').innerHTML = `
    <div class="inv-title">LOADOUT</div>
    <div class="inv-row">
      <div class="inv-item"><span class="dot" style="${dot(healthFresh)}"></span>⌚ Galaxy Fit3</div>
      <div class="inv-item"><span class="dot" style="${dot(healthFresh)}"></span>📱 Android</div>
      <div class="inv-item"><span class="dot" style="${dot(npFresh)}"></span>🎧 Spotify</div>
    </div>`;
}

function render(data) {
  const fresh = !!(data && data.updated_at && (Date.now() - new Date(data.updated_at).getTime()) < FRESH_WINDOW_MS);
  const badge = document.getElementById('sync-badge');
  badge.textContent = fresh ? '● LIVE' : '● SIN SEÑAL';
  badge.style.color = fresh ? 'var(--green)' : 'var(--ink-3)';

  document.getElementById('ring-left').innerHTML = VITAL_DEFS.filter(d => d.side === 'left').map(d => vitalCard(d, data, fresh)).join('');
  document.getElementById('ring-right').innerHTML = VITAL_DEFS.filter(d => d.side === 'right').map(d => vitalCard(d, data, fresh)).join('');

  renderExtra(fresh ? data : {}, fresh);
  renderState(data, fresh);
  const npFresh = renderNowPlaying(data ? data.now_playing : null);
  renderInventory(fresh, npFresh);
}

/* Auto-poll: raw.githubusercontent.com caches ~5 min server-side regardless
   of how often we ask, so polling faster than that doesn't get fresher data
   — it just tells you sooner once new data has actually landed. Pauses when
   the tab isn't visible, and syncs immediately when it becomes visible again. */
const POLL_MS = 60 * 1000;
let lastPollAt = null;

function syncNow() {
  return fetch(VITALS_URL, { cache: 'no-store' })
    .then(r => (r.ok ? r.json() : null))
    .catch(() => null)
    .then(data => {
      render(data);
      lastPollAt = Date.now();
    });
}

syncNow();
setInterval(() => { if (!document.hidden) syncNow(); }, POLL_MS);
document.addEventListener('visibilitychange', () => { if (!document.hidden) syncNow(); });

setInterval(() => {
  const el = document.getElementById('poll-ago');
  if (!lastPollAt || !el) return;
  const s = Math.floor((Date.now() - lastPollAt) / 1000);
  el.textContent = s < 5 ? 'ahora' : `hace ${s}s`;
}, 1000);
</script>

</body>
</html>
